<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wasteland RPG - Engine V7</title>
    <style>
        body { background-color: #050505; color: #c0c0c0; font-family: monospace; margin: 0; padding: 10px; display: flex; justify-content: center; }
        #engine { width: 100%; max-width: 900px; background: #0a0a0a; border: 2px solid #333; padding: 15px; box-sizing: border-box; position: relative; }
        h2 { color: #8B0000; text-align: center; margin-top: 0; text-transform: uppercase; border-bottom: 1px solid #222; padding-bottom: 10px; letter-spacing: 2px; }
        
        /* Map Screen Elements */
        #screen-map { display: flex; flex-direction: column; gap: 15px; }
        .map-header { display: flex; justify-content: space-between; color: #B8860B; font-weight: bold; font-size: 18px; }
        .map-tier { border: 1px solid #222; padding: 15px; text-align: center; background: #111; }
        .map-tier-title { margin-bottom: 10px; color: #666; letter-spacing: 1px; }
        .node-btn { background: #1a1a1a; color: #888; border: 1px solid #444; padding: 15px; margin: 5px; cursor: pointer; font-family: monospace; font-size: 14px; text-transform: uppercase; transition: 0.2s; }
        .node-btn:hover { background: #8B0000; color: #fff; border-color: #ff0000; }
        
        /* Combat Screen - Side-Scrolling Geometry */
        #screen-combat { display: none; }
        
        /* The Floor Line */
        .battlefield { 
            display: flex; 
            justify-content: center; 
            gap: 40px; /* The No-Mans-Land between teams */
            margin-bottom: 20px; 
            padding-bottom: 10px;
            border-bottom: 3px solid #222; /* The Ground */
            min-height: 220px;
            align-items: flex-end; /* Forces entities to stand on the ground */
        }
        
        .team { 
            display: flex; 
            gap: 8px; 
            align-items: flex-end; 
        }
        
        #player-team { flex-direction: row-reverse; /* Puts first character on the right (frontline) */ }
        #enemy-team { flex-direction: row; /* Puts first character on the left (frontline) */ }
        
        .entity { 
            background: #000; 
            border: 1px solid #333; 
            padding: 5px; 
            width: 100px; /* Narrower, vertical cards */
            position: relative; 
            transition: all 0.2s; 
            text-align: center; 
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        
        .entity.active { border-color: #f5f5f5; box-shadow: 0 0 10px rgba(255,255,255,0.2); transform: translateY(-5px); }
        .entity.dead { opacity: 0.2; border-color: #8B0000; filter: grayscale(100%); }
        .entity.targetable-enemy { border-color: #8B0000; box-shadow: 0 0 15px #8B0000; cursor: pointer; }
        .entity.targetable-enemy:active { background: #222; }
        .entity.targetable-ally { border-color: #6B8E23; box-shadow: 0 0 15px #6B8E23; cursor: pointer; }
        .entity.targetable-ally:active { background: #222; }

        .name { font-size: 11px; font-weight: bold; margin-bottom: 5px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .portrait { 
            height: 100px; 
            width: 100%; 
            background-color: transparent; 
            margin-bottom: 8px; 
            background-size: contain; 
            background-repeat: no-repeat; 
            background-position: bottom center; /* Anchor images to the feet */
        }
        
        .hp-container { background: #222; height: 10px; width: 100%; border: 1px solid #000; margin-bottom: 3px; }
        .hp-fill { height: 100%; transition: width 0.3s ease; }
        .player-hp { background-color: #8B0000; /* Darkest Dungeon uses red for player health too */ }
        .enemy-hp { background-color: #8B0000; }
        .stats { font-size: 10px; color: #666; }

        #log { height: 120px; overflow-y: auto; background: #000; border: 1px solid #222; padding: 10px; margin-bottom: 15px; font-size: 12px; color: #555; }
        .log-turn { color: #aaa; margin-top: 5px; border-top: 1px dashed #222; padding-top: 5px; }
        .log-heal { color: #6B8E23; }
        .log-dmg { color: #fff; }
        .log-enemy { color: #ff4444; }
        .log-warn { color: #B8860B; }
        
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { background: #111; color: #ccc; border: 1px solid #444; padding: 15px; font-family: monospace; font-size: 13px; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        button:hover:not(:disabled) { background: #333; border-color: #888; }
        button:active { background: #000; }
        button:disabled { opacity: 0.2; cursor: not-allowed; }
        .btn-cancel { border-color: #8B0000; color: #8B0000; }
        .btn-victory { background-color: #222; color: #B8860B; border-color: #B8860B; }
    </style>
</head>
<body>

<div id="engine">
    
    <!-- MAP SCREEN -->
    <div id="screen-map">
        <h2>Wasteland Sector</h2>
        <div class="map-header">
            <span>TIER: <span id="tier-display">1</span>/4</span>
            <span>SCRAP: <span id="scrap-display">0</span></span>
        </div>
        
        <div id="map-nodes"></div>
    </div>

    <!-- COMBAT SCREEN -->
    <div id="screen-combat">
        <h2 id="turn-indicator">Initializing...</h2>
        <div class="battlefield">
            <div class="team" id="player-team"></div>
            <div class="team" id="enemy-team"></div>
        </div>
        <div id="log"></div>
        <div class="controls" id="command-deck"></div>
    </div>

</div>

<script>
    // --- GLOBAL STATE ---
    let scrap = 0;
    let currentTier = 1;
    
    const playerRoster = [
        { id: 'p1', name: "Bruiser", classType: "BRUISER", maxHp: 80, hp: 80, speed: 8, armor: 0, isPlayer: true, dmgBase: 20, img: "hero_bruiser.png" },
        { id: 'p2', name: "Medic", classType: "MEDIC", maxHp: 50, hp: 50, speed: 12, armor: 0, isPlayer: true, dmgBase: 10, img: "hero_medic.png" },
        { id: 'p3', name: "Scavenger", classType: "SCAVENGER", maxHp: 45, hp: 45, speed: 15, armor: 0, isPlayer: true, dmgBase: 15, img: "hero_scavenger.png" }
    ];
    
    let activeEntities = []; 
    let turnQueue = [];
    let activeIndex = -1;
    let combatActive = false;
    let pendingAction = null; 

    // --- UI ROUTING ---
    function switchScreen(screenId) {
        document.getElementById('screen-map').style.display = 'none';
        document.getElementById('screen-combat').style.display = 'none';
        document.getElementById(screenId).style.display = 'flex';
        document.getElementById(screenId).style.flexDirection = 'column';
    }

    // --- MAP ENGINE ---
    function renderMap() {
        switchScreen('screen-map');
        document.getElementById('scrap-display').innerText = scrap;
        document.getElementById('tier-display').innerText = currentTier;
        
        const mapContainer = document.getElementById('map-nodes');
        mapContainer.innerHTML = '';
        
        if (currentTier > 4) {
            mapContainer.innerHTML = `<div class="map-tier"><h3 style="color:#8B0000">WARLORD DEFEATED.</h3><button onclick="location.reload()">Return to Citadel</button></div>`;
            return;
        }
        
        let nodesHTML = '';
        if (currentTier === 4) {
            nodesHTML = `<button class="node-btn" onclick="initiateCombat('BOSS')" style="border-color:#8B0000; color:#8B0000;">💀 Warlord Stronghold</button>`;
        } else {
            nodesHTML = `
                <button class="node-btn" onclick="initiateCombat('SKIRMISH')">Mutant Skirmish</button>
                <button class="node-btn" onclick="initiateCombat('AMBUSH')">Raider Ambush</button>
            `;
        }
        
        mapContainer.innerHTML = `
            <div class="map-tier">
                <div class="map-tier-title">EXPEDITION ROUTE</div>
                ${nodesHTML}
            </div>
        `;
    }

    // --- COMBAT ENGINE ---
    function initiateCombat(nodeType) {
        switchScreen('screen-combat');
        combatActive = true;
        document.getElementById('log').innerHTML = ''; 
        
        let enemies = [];
        const mult = 1 + ((currentTier - 1) * 0.4); 
        
        if (nodeType === 'BOSS') {
            enemies = [{ id: 'b1', name: "Warlord", classType: "BOSS", maxHp: Math.floor(400*mult), hp: Math.floor(400*mult), speed: 9, armor: 15, isPlayer: false, dmgBase: 40, img: "enemy_boss.png" }];
        } else if (nodeType === 'AMBUSH') {
            enemies = [
                { id: 'e1', name: "Raider", classType: "RAIDER", maxHp: Math.floor(40*mult), hp: Math.floor(40*mult), speed: 10, armor: 0, isPlayer: false, dmgBase: Math.floor(15*mult), img: "enemy_raider.png" },
                { id: 'e2', name: "Raider", classType: "RAIDER", maxHp: Math.floor(40*mult), hp: Math.floor(40*mult), speed: 12, armor: 0, isPlayer: false, dmgBase: Math.floor(15*mult), img: "enemy_raider.png" }
            ];
        } else {
            enemies = [
                { id: 'e1', name: "Mutant", classType: "MUTANT", maxHp: Math.floor(70*mult), hp: Math.floor(70*mult), speed: 7, armor: 0, isPlayer: false, dmgBase: Math.floor(25*mult), img: "enemy_mutant.png" },
                { id: 'e2', name: "Drone", classType: "DRONE", maxHp: Math.floor(25*mult), hp: Math.floor(25*mult), speed: 18, armor: 5, isPlayer: false, dmgBase: Math.floor(10*mult), img: "enemy_drone.png" }
            ];
        }
        
        activeEntities = [...playerRoster, ...enemies];
        turnQueue = [...activeEntities].sort((a, b) => b.speed - a.speed);
        activeIndex = 0;
        
        log("NODE BREACHED.", "log-turn");
        processTurn();
    }

    const logEl = document.getElementById('log');
    function log(msg, styleClass = "log-dmg") {
        const entry = document.createElement('div');
        entry.className = styleClass;
        entry.innerText = msg;
        logEl.appendChild(entry);
        logEl.scrollTop = logEl.scrollHeight;
    }

    function renderField() {
        const pTeam = document.getElementById('player-team');
        const eTeam = document.getElementById('enemy-team');
        pTeam.innerHTML = ''; eTeam.innerHTML = '';

        activeEntities.forEach(ent => {
            const isDead = ent.hp <= 0;
            const isActive = (!isDead && turnQueue.length > 0 && turnQueue[activeIndex]?.id === ent.id) ? 'active' : '';
            const deadClass = isDead ? 'dead' : '';
            
            let targetClass = '';
            let clickHandler = '';
            
            if (pendingAction !== null && !isDead) {
                if (pendingAction === 'CAUTERIZE' && ent.isPlayer) {
                    targetClass = 'targetable-ally';
                    clickHandler = `onclick="resolveAction('${ent.id}')"`;
                } else if (pendingAction !== 'CAUTERIZE' && !ent.isPlayer) {
                    targetClass = 'targetable-enemy';
                    clickHandler = `onclick="resolveAction('${ent.id}')"`;
                }
            }
            
            const html = `
                <div class="entity ${isActive} ${deadClass} ${targetClass}" id="${ent.id}" ${clickHandler}>
                    <div class="name">${ent.name}</div>
                    <div class="portrait" style="background-image: url('${ent.img}');"></div>
                    <div class="hp-container">
                        <div class="hp-fill ${ent.isPlayer ? 'player-hp' : 'enemy-hp'}" style="width: ${(ent.hp / ent.maxHp) * 100}%"></div>
                    </div>
                    <div class="stats">${ent.hp}/${ent.maxHp} HP | ${ent.armor} ARM</div>
                </div>
            `;
            if (ent.isPlayer) pTeam.innerHTML += html;
            else eTeam.innerHTML += html;
        });

        renderCommandDeck();
    }

    function renderCommandDeck() {
        const deck = document.getElementById('command-deck');
        deck.innerHTML = '';

        if (!combatActive) return; 

        if (pendingAction) {
            deck.innerHTML = `<button class="btn-cancel" onclick="cancelAction()" style="grid-column: span 2;">CANCEL ORDERS</button>`;
            return;
        }

        let activeEntity = turnQueue[activeIndex];
        if (!activeEntity.isPlayer) {
            deck.innerHTML = `<button disabled style="grid-column: span 2;">AWAITING TURN...</button>`;
            return;
        }

        if (activeEntity.classType === 'BRUISER') {
            deck.innerHTML += `<button onclick="queueAction('HEAVY_WRENCH')">Heavy Wrench</button>`;
            deck.innerHTML += `<button onclick="executeSelfAction('IRON_GUARD')">Iron Guard</button>`;
        } else if (activeEntity.classType === 'MEDIC') {
            deck.innerHTML += `<button onclick="queueAction('RAD_SHOT')">Rad Shot</button>`;
            deck.innerHTML += `<button onclick="queueAction('CAUTERIZE')">Cauterize</button>`;
        } else if (activeEntity.classType === 'SCAVENGER') {
            deck.innerHTML += `<button onclick="queueAction('PIPE_RIFLE')">Pipe Rifle</button>`;
            deck.innerHTML += `<button onclick="queueAction('FLASHBANG')">Flashbang</button>`;
        }
    }

    function processTurn() {
        if (!combatActive) return;
        pendingAction = null;
        let activeEntity = turnQueue[activeIndex];

        if (activeEntity.hp <= 0) {
            nextTurn();
            return;
        }

        renderField();
        document.getElementById('turn-indicator').innerText = `Active: ${activeEntity.name}`;

        if (activeEntity.isPlayer) {
            log(`[ ${activeEntity.name.toUpperCase()} ] awaits orders.`, "log-turn");
        } else {
            log(`[ ${activeEntity.name.toUpperCase()} ] is striking...`, "log-turn");
            setTimeout(() => executeEnemyAi(activeEntity), 1000);
        }
    }

    function queueAction(actionType) {
        pendingAction = actionType;
        if (actionType === 'CAUTERIZE') log("Select ally to heal...", "log-heal");
        else log("Select hostile target...", "log-warn");
        renderField();
    }

    function cancelAction() {
        pendingAction = null;
        log("Orders cancelled.", "log-warn");
        renderField();
    }

    function resolveAction(targetId) {
        let activeEntity = turnQueue[activeIndex];
        let target = activeEntities.find(e => e.id === targetId);
        
        if (pendingAction === 'CAUTERIZE') {
            let heal = 20 + Math.floor(Math.random() * 10);
            target.hp = Math.min(target.maxHp, target.hp + heal);
            log(`> ${activeEntity.name} cauterizes ${target.name} for ${heal} HP!`, "log-heal");
        } else {
            let dmg = activeEntity.dmgBase + Math.floor(Math.random() * 6);
            if (pendingAction === 'FLASHBANG') dmg = Math.floor(dmg * 0.5); 
            
            let netDmg = Math.max(1, dmg - target.armor);
            target.hp = Math.max(0, target.hp - netDmg);
            log(`> ${activeEntity.name} uses ${pendingAction.replace('_', ' ')} on ${target.name} for ${netDmg} DMG!`);
        }
        
        pendingAction = null;
        checkWinState();
    }

    function executeSelfAction(actionType) {
        let activeEntity = turnQueue[activeIndex];
        if (actionType === 'IRON_GUARD') {
            activeEntity.armor += 15;
            log(`> ${activeEntity.name} deploys IRON GUARD (+15 ARMOR).`);
        }
        checkWinState();
    }

    function executeEnemyAi(enemy) {
        if (!combatActive) return;
        
        let validTargets = activeEntities.filter(e => e.isPlayer && e.hp > 0);
        let target = validTargets.sort(() => 0.5 - Math.random())[0]; 
        
        if (target) {
            let dmg = enemy.dmgBase + Math.floor(Math.random() * 5);
            let netDmg = Math.max(1, dmg - target.armor);
            target.hp = Math.max(0, target.hp - netDmg);
            log(`> ${enemy.name} attacks ${target.name} for ${netDmg} DMG!`, "log-enemy");
            target.armor = 0; 
        }
        checkWinState();
    }

    function checkWinState() {
        renderField();
        
        const playersAlive = activeEntities.some(e => e.isPlayer && e.hp > 0);
        const enemiesAlive = activeEntities.some(e => !e.isPlayer && e.hp > 0);

        if (!playersAlive) {
            log("SQUAD WIPED.", "log-enemy");
            combatActive = false;
            document.getElementById('command-deck').innerHTML = `<button onclick="location.reload()" style="grid-column: span 2; border-color: #8B0000; color: #8B0000;">RESTART CAMPAIGN</button>`;
        } else if (!enemiesAlive) {
            log("HOSTILES ELIMINATED.", "log-heal");
            combatActive = false;
            
            let scrapGained = Math.floor(Math.random() * 30) + (currentTier * 20);
            scrap += scrapGained;
            currentTier++;
            
            playerRoster.forEach(p => p.armor = 0);
            
            document.getElementById('command-deck').innerHTML = `<button class="btn-victory" onclick="renderMap()" style="grid-column: span 2;">LOOT ${scrapGained} SCRAP & CONTINUE</button>`;
        } else {
            document.getElementById('command-deck').innerHTML = `<button disabled style="grid-column: span 2;">RESOLVING...</button>`;
            setTimeout(nextTurn, 800);
        }
    }

    function nextTurn() {
        activeIndex++;
        if (activeIndex >= turnQueue.length) activeIndex = 0; 
        processTurn();
    }

    renderMap();

</script>
</body>
</html>
