<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wasteland RPG - Engine V32.0 (Crafting & Drone Flight)</title>
<style>
body { background-color: #000; color: #c0c0c0; font-family: monospace; margin: 0; padding: 0; display: flex; justify-content: center; height: 100dvh; align-items: center; overflow: hidden; }
#engine { width: 100%; max-width: 900px; height: 100dvh; background: #000; position: relative; display: flex; flex-direction: column; }

#screen-title { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; background: linear-gradient(rgba(10, 10, 10, 0.8), rgba(0, 0, 0, 0.95)), repeating-linear-gradient(45deg, #111 0, #111 2px, #000 2px, #000 6px), url('bg_title.png'); background-size: cover, auto, cover; background-position: center; text-align: center; padding: 20px; }
.title-header { font-size: clamp(30px, 8vw, 60px); color: #B8860B; font-weight: bold; text-transform: uppercase; letter-spacing: 4px; text-shadow: 3px 3px 0px #8B0000, 0 0 15px rgba(184, 134, 11, 0.5); margin-bottom: 10px; }
.title-sub { color: #666; font-size: clamp(12px, 3vw, 16px); letter-spacing: 8px; margin-bottom: 8vh; text-shadow: 1px 1px 2px #000; }
.title-menu { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 300px; }
.title-btn { background: #111; color: #ccc; border: 2px solid #444; padding: 20px; font-family: monospace; font-size: clamp(14px, 4vw, 18px); font-weight: bold; cursor: pointer; text-transform: uppercase; transition: all 0.2s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
.title-btn:hover { background: #8B0000; color: #fff; border-color: #ff0000; box-shadow: 0 0 15px rgba(255,0,0,0.4); transform: translateY(-2px); }
.title-btn:active { transform: translateY(2px); box-shadow: none; }
.btn-continue { border-color: #B8860B; color: #B8860B; }

#screen-map { display: none; flex-direction: column; padding: 20px; height: 100%; box-sizing: border-box;}
.map-header { display: flex; justify-content: space-between; color: #B8860B; font-weight: bold; font-size: 18px; margin-bottom: 15px; flex-shrink: 0;}
.outpost-btn { background: #0a110a; border: 1px solid #6B8E23; color: #6B8E23; font-weight: bold; padding: 15px; margin-bottom: 15px; font-family: monospace; font-size: 14px; cursor: pointer; text-align: center; border-radius: 4px; transition: 0.2s; flex-shrink: 0;}
.outpost-btn:hover { background: #6B8E23; color: #000; }

.map-viewport { flex-grow: 1; border: 1px solid #222; background: linear-gradient(rgba(15,15,15,0.9), rgba(5,5,5,0.9)), repeating-linear-gradient(0deg, transparent, transparent 19px, #1a1a1a 19px, #1a1a1a 20px), repeating-linear-gradient(90deg, transparent, transparent 19px, #1a1a1a 19px, #1a1a1a 20px); overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 30px 0; position: relative; }
.map-track { display: flex; flex-direction: column; align-items: center; width: 100%; }
.map-row { display: flex; gap: 20px; justify-content: center; width: 100%; position: relative; z-index: 2; flex-wrap: wrap;}
.map-connector { width: 4px; height: 30px; background: #333; z-index: 1; transition: background 0.3s; }
.connector-cleared { background: #6B8E23; box-shadow: 0 0 5px #6B8E23; }

.map-node { width: 75px; height: 75px; border-radius: 50%; background: #111; border: 2px solid #444; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: all 0.3s; font-family: monospace; color: #888; padding: 0; position: relative; }
.node-lbl { font-size: 9px; margin-top: 4px; letter-spacing: 1px; font-weight: bold; }
.node-icon { font-size: 22px; }
.node-locked { opacity: 0.3; cursor: not-allowed; }
.node-cleared { border-color: #6B8E23; color: #555; background: #0a110a; }
.node-cleared .node-icon { filter: grayscale(100%); opacity: 0.5; }
.node-cleared::after { content: '✓'; position: absolute; color: #6B8E23; font-size: 30px; font-weight: bold; opacity: 0.5; }

@keyframes pulseActive { 0% { box-shadow: 0 0 5px #8B0000; border-color: #8B0000; } 50% { box-shadow: 0 0 20px #ff4444; border-color: #ff4444; } 100% { box-shadow: 0 0 5px #8B0000; border-color: #8B0000; } }
.node-active { color: #fff; background: #1a0a0a; animation: pulseActive 2s infinite; }
.node-active:hover { transform: scale(1.1); }
.boss-node.node-active { animation: pulseActive 1s infinite; background: #2a0505; }

#screen-outpost { display: none; flex-direction: column; gap: 15px; padding: 20px; height: 100%; box-sizing: border-box; overflow-y: auto;}

.op-tabs { display: flex; gap: 10px; margin-bottom: 10px; }
.op-tab-btn { flex: 1; padding: 10px; background: #111; border: 1px solid #444; color: #888; cursor: pointer; font-weight: bold; }
.op-tab-active { background: #B8860B; color: #000; border-color: #B8860B; }

.outpost-roster { display: grid; grid-template-columns: 1fr; gap: 15px; }
.upgrade-card { background: #0a0a0a; border: 1px solid #333; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
.upgrade-header { display: flex; justify-content: space-between; align-items: center; color: #B8860B; font-weight: bold; border-bottom: 1px solid #222; padding-bottom: 5px;}
.upgrade-stats { display: flex; justify-content: space-between; font-size: 11px; color: #888; }
.upgrade-btn-group { display: flex; gap: 10px; margin-top: 5px; flex-wrap: wrap;}
.upg-btn { flex: 1; min-width: 30%; padding: 10px; background: #111; color: #ccc; border: 1px solid #444; cursor: pointer; font-family: monospace; font-size: 12px; transition: 0.2s;}
.upg-btn:hover:not(:disabled) { background: #333; border-color: #888; color: #fff;}
.upg-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.sub-menu-btn { min-width: 45%; } 

.pos-btn-1 { border-color: #8B0000; color: #ff5555; background: #2a0a0a; } 
.pos-btn-2 { border-color: #B8860B; color: #ffaa00; background: #2a2a0a; } 
.pos-btn-3 { border-color: #6B8E23; color: #aaffaa; background: #0a2a0a; } 
.pos-btn-0 { border-color: #444; color: #888; background: #111; } 

.med-btn { border-color: #6B8E23; color: #6B8E23; }
.med-btn:hover:not(:disabled) { background: #6B8E23; color: #000; }
.revive-btn { border-color: #8B0000; color: #ff4444; }
.revive-btn:hover:not(:disabled) { background: #8B0000; color: #fff; }
.perk-btn { background: #1a1a2a; border-color: #4488ff; color: #4488ff; font-weight: bold; }
.perk-btn:hover:not(:disabled) { background: #2a2a4a; color: #fff; }
.cost-txt { color: #B8860B; }
.return-btn { background: #111; color: #ccc; border: 1px solid #444; padding: 15px; font-family: monospace; font-size: 14px; cursor: pointer; text-transform: uppercase; margin-top: auto; transition: 0.2s; flex-shrink:0;}
.return-btn:hover { background: #222; border-color: #888; }

.inventory-sect { background: #111; border: 1px solid #444; padding: 10px; margin-top: 10px; }
.inventory-title { color: #B8860B; font-weight: bold; font-size: 13px; margin-bottom: 5px; display:flex; justify-content: space-between;}
.inventory-grid { display: flex; gap: 5px; flex-wrap: wrap; }
.inv-slot { background: #1a1a1a; border: 1px solid #333; padding: 6px; font-size: 11px; color: #aaa; cursor: pointer; flex: 1; min-width: 45%; text-align: center; }
.inv-slot:hover:not(:disabled) { background: #333; color: #fff; border-color: #888; }

#screen-combat { display: none; flex-direction: column; height: 100%; }
.sky-layer { background-size: cover; background-position: center bottom; flex-grow: 1; display: flex; flex-direction: column; position: relative; }
#queue-display { text-align: center; color: #ccc; padding: 8px; font-size: clamp(10px, 3vw, 12px); letter-spacing: 2px; font-weight: bold; background: rgba(0,0,0,0.7); text-shadow: 1px 1px 2px #000; }
.battlefield { display: flex; justify-content: center; gap: 2vw; flex-grow: 1; align-items: flex-end; padding: 0 5px; box-sizing: border-box; margin-bottom: 12vh; }
.team { display: flex; align-items: flex-end; justify-content: center; }
#player-team { flex-direction: row-reverse; } 
#enemy-team { flex-direction: row; }
.entity { width: clamp(55px, 16vw, 110px); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; position: relative; transition: transform 0.2s; gap: 2px; margin: 0 -1.5vw; z-index: 1; }
.entity:nth-child(1) { z-index: 3; } .entity:nth-child(2) { z-index: 2; } .entity:nth-child(3) { z-index: 1; } .entity:nth-child(4) { z-index: 4; }
.entity.active .portrait { filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.9)); }
.entity.dead { opacity: 0.3; filter: grayscale(100%); transform: scale(0.9); }
.entity.targetable-enemy .portrait { filter: drop-shadow(0 0 12px #ff0000); cursor: pointer; }
.entity.targetable-ally .portrait { filter: drop-shadow(0 0 12px #6B8E23); cursor: pointer; }
.entity.targetable-enemy:active .portrait { filter: drop-shadow(0 0 20px #ff0000) brightness(1.5); }
.hp-text { font-size: clamp(9px, 2.5vw, 12px); font-weight: bold; margin-bottom: 2px; color: #fff; text-shadow: 1px 1px 3px #000; text-align: center; white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 3px; }
.hp-container { background: #111; height: 6px; width: 85%; border: 1px solid #000; box-shadow: 0 0 4px #000; margin: 0 auto; }
.hp-fill { height: 100%; transition: width 0.3s ease; }
.player-hp { background-color: #8B0000; } .enemy-hp { background-color: #8B0000; }
.status-badge { font-size: 10px; width: 12px; height: 12px; display: flex; align-items: center; justify-content: center; border-radius: 2px; }
.status-bleed { background-color: rgba(139,0,0,0.7); color: #fff; text-shadow: 0 0 2px #000; }
.status-stun { background-color: rgba(184,134,11,0.7); color: #000; font-weight: bold; }
.status-shield { background-color: rgba(107,142,35,0.7); color: #fff; }
.portrait { width: calc(100% * var(--sprite-scale, 1)); height: auto; max-height: 25vh; object-fit: contain; object-position: bottom; transition: all 0.2s; filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.8)); }

/* V32 Drone Hover Animation */
@keyframes hoverSprite { 0% { transform: translateY(0); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0); } }
.hovering { animation: hoverSprite 3s ease-in-out infinite; margin-bottom: 40px; }

@keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.3); } }
.fct { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); font-weight: bold; font-size: clamp(14px, 4vw, 20px); text-shadow: 2px 2px 4px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; animation: floatUp 1s ease-out forwards; pointer-events: none; z-index: 20; white-space: nowrap; }
.fct-dmg { color: #ff4444; } .fct-heal { color: #6B8E23; } .fct-status { color: #B8860B; } .fct-weak { color: #ffaa00; font-size: clamp(18px, 5vw, 24px); }

.dashboard { height: 35vh; max-height: 250px; background: #050505; border: 2px solid #333; display: grid; grid-template-columns: 1fr 1fr; box-sizing: border-box; margin: 5px; }
#command-deck { border-right: 2px solid #333; padding: 10px; display: flex; flex-direction: column; justify-content: center; gap: 8px; overflow-y: auto;}
#log { padding: 10px; overflow-y: auto; font-size: clamp(10px, 3vw, 12px); color: #555; display: flex; flex-direction: column; }
.log-turn { color: #aaa; margin-top: 5px; } .log-heal { color: #6B8E23; } .log-dmg { color: #8B0000; } .log-status { color: #B8860B; }
button { background: #111; color: #ccc; border: 1px solid #444; padding: clamp(10px, 3vh, 15px); font-family: monospace; font-size: clamp(10px, 3vw, 13px); cursor: pointer; text-transform: uppercase; transition: 0.2s; }
button:hover:not(:disabled) { background: #222; border-color: #888; }
button:active { background: #000; }
button:disabled { opacity: 0.2; cursor: not-allowed; border-color: #222; }
.dash-msg { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 14px; color: #666; text-align: center; }
</style>
</head>
<body>

<div id="engine">
    <div id="screen-title">
        <div class="title-header">Wasteland<br>Protocol</div>
        <div class="title-sub">ENGINE V32.0</div>
        <div class="title-menu" id="title-menu-container"></div>
    </div>

    <div id="screen-map">
        <div class="map-header">
            <span>SECTOR 1</span>
            <span>SCRAP: <span id="scrap-display">0</span></span>
        </div>
        <button class="outpost-btn" onclick="renderOutpost()">⛺ TACTICAL OUTPOST</button>
        <div class="map-viewport" id="map-nodes"></div>
    </div>

    <div id="screen-outpost">
        <div class="map-header">
            <span>OUTPOST COMMAND</span>
            <span>SCRAP: <span id="outpost-scrap">0</span></span>
        </div>
        
        <div class="op-tabs">
            <button id="tab-roster" class="op-tab-btn op-tab-active" onclick="setOutpostTab('ROSTER')">SQUAD ROSTER</button>
            <button id="tab-workbench" class="op-tab-btn" onclick="setOutpostTab('WORKBENCH')">WORKBENCH</button>
        </div>

        <div id="outpost-roster-view" style="display:flex; flex-direction:column; gap:15px; flex-grow:1; overflow-y:auto;">
            <div id="outpost-roster" class="outpost-roster"></div>
        </div>

        <!-- V32 Workbench View -->
        <div id="outpost-workbench-view" style="display:none; flex-direction:column; gap:15px; flex-grow:1; overflow-y:auto;">
            <div class="upgrade-card">
                <div class="upgrade-header">RAW MATERIALS</div>
                <div class="upgrade-stats" style="font-size: 14px; color: #fff; padding: 10px 0;">
                    <span id="mat-parts">⚙️ PARTS: 0</span>
                    <span id="mat-chems">🧪 CHEMS: 0</span>
                    <span id="mat-tech">💻 TECH: 0</span>
                </div>
                <div class="upgrade-btn-group" style="margin-top: 5px;">
                    <button class="upg-btn" id="btn-breakdown" onclick="breakdownScrap()">BREAKDOWN SCRAP (25 SCRAP)</button>
                </div>
            </div>

            <div class="upgrade-card">
                <div class="upgrade-header">CRAFTING SCHEMATICS</div>
                <div class="upgrade-btn-group" id="crafting-grid">
                    <!-- Injected by JS based on materials -->
                </div>
            </div>
        </div>

        <div class="inventory-sect">
            <div class="inventory-title"><span>TACTICAL INVENTORY</span> <span id="inv-count">0/4</span></div>
            <div id="outpost-inventory" class="inventory-grid"></div>
        </div>

        <button class="return-btn" onclick="renderMap()">CONFIRM & RETURN TO MAP</button>
    </div>

    <div id="screen-combat">
        <div class="sky-layer" id="combat-sky-layer">
            <div id="queue-display">Q: INITIATING...</div>
            <div class="battlefield">
                <div class="team" id="player-team"></div>
                <div class="team" id="enemy-team"></div>
            </div>
        </div>
        <div class="dashboard">
            <div id="command-deck"></div>
            <div id="log"></div>
        </div>
    </div>
</div>

<script>
const SAVE_KEY = 'wasteland_rpg_engine_v32'; 
let scrap = 0; let currentTier = 1;
let inventory = []; 
let materials = { parts: 0, chems: 0, tech: 0 }; // V32 Crafting Mats
let outpostTab = 'ROSTER';

let activePosSelector = null;
let activePerkSelector = null;

const SECTOR_LAYOUT = [
    ['BOSS'], ['MECH', 'RAIDERS'], ['BEASTS', 'MECH', 'RAIDERS'], ['RAIDERS', 'BEASTS'], ['MECH', 'RAIDERS', 'BEASTS'], ['BEASTS', 'MECH'], ['RAIDERS', 'BEASTS', 'RAIDERS'], ['MECH', 'RAIDERS'], ['BEASTS', 'RAIDERS', 'MECH'], ['RAIDERS']
];
const TOTAL_TIERS = SECTOR_LAYOUT.length;

const ROSTER_TEMPLATE = [
    { id: 'p1', name: "Bruiser", classType: "BRUISER", maxHp: 80, hp: 80, speed: 8, armor: 0, isPlayer: true, dmgBase: 20, img: "hero_bruiser.png", scale: 1.15, hpDrop: 0, stunnedTurns: 0, bleedingTurns: 0, armorTurns: 0, resistances: { phys: 5, bio: 0, energy: 0 }, upgradeCount: 0, gridPos: 1, level: 1, xp: 0, xpToNext: 100, perkPoints: 0, trait: null, cooldowns: { heavy_wrench: 0, iron_guard: 0 } },
    { id: 'p2', name: "Medic", classType: "MEDIC", maxHp: 50, hp: 50, speed: 12, armor: 0, isPlayer: true, dmgBase: 10, img: "hero_medic.png", scale: 1.6, hpDrop: 0, stunnedTurns: 0, bleedingTurns: 0, armorTurns: 0, resistances: { phys: 0, bio: 10, energy: 0 }, upgradeCount: 0, gridPos: 2, level: 1, xp: 0, xpToNext: 100, perkPoints: 0, trait: null, cooldowns: { cauterize: 0 } },
    { id: 'p3', name: "Scavenger", classType: "SCAVENGER", maxHp: 45, hp: 45, speed: 15, armor: 0, isPlayer: true, dmgBase: 15, img: "hero_scavenger.png", scale: 1.25, hpDrop: -25, stunnedTurns: 0, bleedingTurns: 0, armorTurns: 0, resistances: { phys: 0, bio: 0, energy: 5 }, upgradeCount: 0, gridPos: 3, level: 1, xp: 0, xpToNext: 100, perkPoints: 0, trait: null, cooldowns: { flashbang: 0 } },
    { id: 'p4', name: "Pyro", classType: "PYROMANIAC", maxHp: 55, hp: 55, speed: 11, armor: 0, isPlayer: true, dmgBase: 12, img: "hero_pyro.png", scale: 1.1, hpDrop: 0, stunnedTurns: 0, bleedingTurns: 0, armorTurns: 0, resistances: { phys: 0, bio: 0, energy: 10 }, upgradeCount: 0, gridPos: 0, level: 1, xp: 0, xpToNext: 100, perkPoints: 0, trait: null, cooldowns: { molotov: 0 } },
    { id: 'p5', name: "Breacher", classType: "SHOTGUNNER", maxHp: 65, hp: 65, speed: 9, armor: 5, isPlayer: true, dmgBase: 22, img: "hero_shotgunner.png", scale: 1.15, hpDrop: 0, stunnedTurns: 0, bleedingTurns: 0, armorTurns: 0, resistances: { phys: 5, bio: 0, energy: 0 }, upgradeCount: 0, gridPos: 0, level: 1, xp: 0, xpToNext: 100, perkPoints: 0, trait: null, cooldowns: { buckshot: 0 } },
    { id: 'p6', name: "Ghost", classType: "SNIPER", maxHp: 40, hp: 40, speed: 16, armor: 0, isPlayer: true, dmgBase: 28, img: "hero_sniper.png", scale: 0.9, hpDrop: -10, stunnedTurns: 0, bleedingTurns: 0, armorTurns: 0, resistances: { phys: 0, bio: 0, energy: 0 }, upgradeCount: 0, gridPos: 0, level: 1, xp: 0, xpToNext: 100, perkPoints: 0, trait: null, cooldowns: { deadeye: 0 } },
    { id: 'p7', name: "War Hound", classType: "HOUND", maxHp: 35, hp: 35, speed: 19, armor: 0, isPlayer: true, dmgBase: 16, img: "hero_hound.png", scale: 0.8, hpDrop: 0, stunnedTurns: 0, bleedingTurns: 0, armorTurns: 0, resistances: { phys: -2, bio: 10, energy: 0 }, upgradeCount: 0, gridPos: 0, level: 1, xp: 0, xpToNext: 100, perkPoints: 0, trait: null, cooldowns: { feral_bite: 0 } }
];

let playerRoster = []; let activeEntities = []; let turnQueue = []; let activeIndex = -1; let combatActive = false; let pendingAction = null;

function switchScreen(screenId) { document.querySelectorAll('#engine > div').forEach(el => el.style.display = 'none'); document.getElementById(screenId).style.display = 'flex'; }

function renderTitleScreen() {
    switchScreen('screen-title'); document.getElementById('title-menu-container').innerHTML = '';
    if (localStorage.getItem(SAVE_KEY)) document.getElementById('title-menu-container').innerHTML += `<button class="title-btn btn-continue" onclick="continueGame()">Continue Expedition</button>`;
    document.getElementById('title-menu-container').innerHTML += `<button class="title-btn" onclick="startNewGame()">New Expedition</button>`;
}

function startNewGame() { localStorage.removeItem(SAVE_KEY); scrap = 0; currentTier = 1; inventory = ['MED_STIM']; materials = { parts: 0, chems: 0, tech: 0 }; playerRoster = JSON.parse(JSON.stringify(ROSTER_TEMPLATE)); saveGameState(); renderMap(); }
function continueGame() { loadGameState(); renderMap(); }

function saveGameState() { localStorage.setItem(SAVE_KEY, JSON.stringify({ scrap, tier: currentTier, roster: playerRoster, inventory, materials })); }
function loadGameState() {
    let d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (d) { scrap = d.scrap || 0; currentTier = d.tier || 1; playerRoster = d.roster || JSON.parse(JSON.stringify(ROSTER_TEMPLATE)); inventory = d.inventory || ['MED_STIM']; materials = d.materials || { parts: 0, chems: 0, tech: 0 }; }
}

function renderMap() {
    switchScreen('screen-map'); document.getElementById('scrap-display').innerText = scrap; const mapC = document.getElementById('map-nodes');
    if (currentTier > TOTAL_TIERS) { mapC.innerHTML = `<h3 style="color:#8B0000; text-align:center;">SECTOR CLEARED</h3><button class="return-btn" onclick="renderTitleScreen()">Return to Citadel</button>`; return; }
    let m = `<div class="map-track">`;
    for (let i = 0; i < TOTAL_TIERS; i++) {
        let t = TOTAL_TIERS - i; let rowStatus = (t === currentTier) ? 'active' : (t < currentTier) ? 'cleared' : 'locked'; let dis = (t !== currentTier) ? 'disabled' : '';
        m += `<div class="map-row">`;
        SECTOR_LAYOUT[i].forEach(nT => {
            let icon = '🎯'; let lbl = 'RAIDERS';
            if (nT === 'BOSS') { icon = '💀'; lbl = 'WARLORD'; } else if (nT === 'BEASTS') { icon = '☣️'; lbl = 'BEASTS'; } else if (nT === 'MECH') { icon = '⚙️'; lbl = 'MECH'; }
            m += `<button class="map-node node-${rowStatus} ${(nT === 'BOSS' && t === currentTier) ? 'boss-node' : ''}" ${dis} onclick="initiateCombat('${nT}')"><span class="node-icon">${icon}</span><span class="node-lbl">${lbl}</span></button>`;
        });
        m += `</div>`; if (t > 1) m += `<div class="map-connector ${(t <= currentTier) ? 'connector-cleared' : ''}"></div>`;
    }
    m += `</div>`; mapC.innerHTML = m; setTimeout(() => { mapC.scrollTop = mapC.scrollHeight; }, 10);
}

function setOutpostTab(tab) {
    outpostTab = tab;
    document.getElementById('tab-roster').className = `op-tab-btn ${tab === 'ROSTER' ? 'op-tab-active' : ''}`;
    document.getElementById('tab-workbench').className = `op-tab-btn ${tab === 'WORKBENCH' ? 'op-tab-active' : ''}`;
    document.getElementById('outpost-roster-view').style.display = tab === 'ROSTER' ? 'flex' : 'none';
    document.getElementById('outpost-workbench-view').style.display = tab === 'WORKBENCH' ? 'flex' : 'none';
    renderOutpost();
}

function renderOutpost() {
    switchScreen('screen-outpost'); document.getElementById('outpost-scrap').innerText = scrap; 
    
    // Render Roster
    const c = document.getElementById('outpost-roster'); c.innerHTML = '';
    playerRoster.forEach(char => {
        let cost = 30 + (char.upgradeCount * 25); let canUpg = scrap >= cost; let isDead = char.hp <= 0; let isInj = char.hp < char.maxHp && char.hp > 0;
        let medHtml = isDead ? `<button class="upg-btn revive-btn" ${scrap < 50 ? 'disabled' : ''} onclick="medBay('${char.id}', 'REVIVE')">DEFIB (50)</button>` : `<button class="upg-btn med-btn" ${!isInj || scrap < 10 ? 'disabled' : ''} onclick="medBay('${char.id}', 'HEAL')">TRIAGE (10)</button>`;
        
        let traitDisplay = '';
        if (char.trait) { traitDisplay = `TRAIT: ${char.trait}`; } else if (char.perkPoints > 0) { traitDisplay = `<button class="upg-btn perk-btn" style="padding:2px 5px;" onclick="activePerkSelector='${char.id}'; activePosSelector=null; renderOutpost()">CHOOSE PERK (!)</button>`; } else { traitDisplay = `LVL ${char.level} (${char.xp}/${char.xpToNext} XP)`; }

        let posText = char.gridPos === 1 ? '[1] FRONTLINE' : char.gridPos === 2 ? '[2] MIDLINE' : char.gridPos === 3 ? '[3] BACKLINE' : '[X] BENCHED';
        let posClass = `pos-btn-${char.gridPos}`;
        let btnGroupHtml = '';

        if (activePosSelector === char.id) {
            btnGroupHtml = `<button class="upg-btn sub-menu-btn pos-btn-1" onclick="assignSlot('${char.id}', 1)">[1] FRONT</button> <button class="upg-btn sub-menu-btn pos-btn-2" onclick="assignSlot('${char.id}', 2)">[2] MID</button> <button class="upg-btn sub-menu-btn pos-btn-3" onclick="assignSlot('${char.id}', 3)">[3] BACK</button> <button class="upg-btn sub-menu-btn pos-btn-0" onclick="assignSlot('${char.id}', 0)">[X] BENCH</button> <button class="upg-btn sub-menu-btn" style="border-color:#888;" onclick="activePosSelector=null; renderOutpost()">CANCEL</button>`;
        } else if (activePerkSelector === char.id) {
            btnGroupHtml = `<button class="upg-btn sub-menu-btn perk-btn" onclick="assignPerk('${char.id}', 'VETERAN')">VETERAN (+5 DMG)</button> <button class="upg-btn sub-menu-btn perk-btn" onclick="assignPerk('${char.id}', 'FORTIFIED')">FORTIFIED (+25 HP)</button> <button class="upg-btn sub-menu-btn" style="border-color:#888;" onclick="activePerkSelector=null; renderOutpost()">CANCEL</button>`;
        } else {
            btnGroupHtml = `<button class="upg-btn ${posClass}" onclick="activePosSelector='${char.id}'; activePerkSelector=null; renderOutpost()">${posText}</button> <button class="upg-btn" ${!canUpg || isDead ? 'disabled' : ''} onclick="buyUpgrade('${char.id}', 'HP', ${cost})">+10 HP</button> <button class="upg-btn" ${!canUpg || isDead ? 'disabled' : ''} onclick="buyUpgrade('${char.id}', 'DMG', ${cost})">+3 DMG</button> ${medHtml}`;
        }

        c.innerHTML += `<div class="upgrade-card" style="${isDead ? 'border-color: #8B0000; opacity: 0.8;' : ''}"> <div class="upgrade-header"><span>${char.name} (${char.classType})</span><span>${traitDisplay}</span></div> <div class="upgrade-stats"><span>HP: ${char.hp}/${char.maxHp}</span><span>DMG: ${char.dmgBase}</span><span>UPG: <span class="cost-txt">${cost}</span></span></div> <div class="upgrade-btn-group">${btnGroupHtml}</div> </div>`;
    });

    // Render Workbench
    document.getElementById('mat-parts').innerText = `⚙️ PARTS: ${materials.parts}`;
    document.getElementById('mat-chems').innerText = `🧪 CHEMS: ${materials.chems}`;
    document.getElementById('mat-tech').innerText = `💻 TECH: ${materials.tech}`;
    document.getElementById('btn-breakdown').disabled = scrap < 25;

    let wbHtml = '';
    let invFull = inventory.length >= 4;
    wbHtml += `<button class="upg-btn" ${materials.chems < 2 || invFull ? 'disabled' : ''} onclick="craftItem('MED_STIM')">CRAFT MED-STIM (2 🧪)</button>`;
    wbHtml += `<button class="upg-btn" ${materials.parts < 2 || invFull ? 'disabled' : ''} onclick="craftItem('SCRAP_BOMB')">CRAFT SCRAP BOMB (2 ⚙️)</button>`;
    wbHtml += `<button class="upg-btn" ${materials.chems < 1 || materials.tech < 1 || invFull ? 'disabled' : ''} onclick="craftItem('ADRENALINE')">CRAFT ADRENALINE (1 🧪, 1 💻)</button>`;
    wbHtml += `<button class="upg-btn" ${materials.tech < 2 || invFull ? 'disabled' : ''} onclick="craftItem('EMP_CHARGE')">CRAFT EMP CHARGE (2 💻)</button>`;
    document.getElementById('crafting-grid').innerHTML = wbHtml;

    // Render Inventory
    document.getElementById('inv-count').innerText = `${inventory.length}/4`;
    const invC = document.getElementById('outpost-inventory'); invC.innerHTML = '';
    for (let i = 0; i < 4; i++) {
        let item = inventory[i];
        if (item) {
            let label = item === 'MED_STIM' ? '💉 Med-Stim' : item === 'SCRAP_BOMB' ? '💣 Scrap Bomb' : item === 'ADRENALINE' ? '⚡ Adrenaline' : '🔋 EMP Charge';
            invC.innerHTML += `<button class="inv-slot" onclick="useOutpostItem(${i})">${label} [SELL]</button>`;
        } else {
            invC.innerHTML += `<button class="inv-slot" disabled>[ EMPTY SLOT ]</button>`;
        }
    }
}

// V32 Workbench Logic
function breakdownScrap() {
    if (scrap < 25) return;
    scrap -= 25;
    let m = ['parts', 'chems', 'tech'][Math.floor(Math.random() * 3)];
    materials[m]++;
    saveGameState(); renderOutpost();
}

function craftItem(item) {
    if (inventory.length >= 4) return;
    if (item === 'MED_STIM' && materials.chems >= 2) { materials.chems -= 2; inventory.push(item); }
    else if (item === 'SCRAP_BOMB' && materials.parts >= 2) { materials.parts -= 2; inventory.push(item); }
    else if (item === 'ADRENALINE' && materials.chems >= 1 && materials.tech >= 1) { materials.chems -= 1; materials.tech -= 1; inventory.push(item); }
    else if (item === 'EMP_CHARGE' && materials.tech >= 2) { materials.tech -= 2; inventory.push(item); }
    saveGameState(); renderOutpost();
}

function assignSlot(charId, newSlot) { let char = playerRoster.find(c => c.id === charId); let oldSlot = char.gridPos; if (newSlot > 0) { let existingChar = playerRoster.find(c => c.gridPos === newSlot && c.id !== charId); if (existingChar) existingChar.gridPos = oldSlot; } char.gridPos = newSlot; activePosSelector = null; saveGameState(); renderOutpost(); }
function assignPerk(charId, traitName) { let char = playerRoster.find(c => c.id === charId); if (traitName === 'VETERAN') { char.trait = 'VETERAN'; char.dmgBase += 5; } else if (traitName === 'FORTIFIED') { char.trait = 'FORTIFIED'; char.maxHp += 25; char.hp += 25; } char.perkPoints--; activePerkSelector = null; saveGameState(); renderOutpost(); }
function useOutpostItem(index) { inventory.splice(index, 1); scrap += 20; saveGameState(); renderOutpost(); }
function buyUpgrade(charId, type, cost) { if (scrap < cost) return; scrap -= cost; let c = playerRoster.find(c => c.id === charId); if (c.hp <= 0) return; if (type === 'HP') { c.maxHp += 10; c.hp += 10; } else if (type === 'DMG') { c.dmgBase += 3; } c.upgradeCount++; saveGameState(); renderOutpost(); }
function medBay(charId, action) { let c = playerRoster.find(c => c.id === charId); if (action === 'HEAL' && scrap >= 10 && c.hp > 0 && c.hp < c.maxHp) { scrap -= 10; c.hp = Math.min(c.maxHp, c.hp + Math.floor(c.maxHp * 0.4)); } else if (action === 'REVIVE' && scrap >= 50 && c.hp <= 0) { scrap -= 50; c.hp = Math.floor(c.maxHp * 0.25); } saveGameState(); renderOutpost(); }

            { name: "Chem Fiend", classType: "MUTANT", range: 'ranged', maxHp: 60, speed: 11, armor: 0, dmgBase: 15, img: "enemy_chem.png", scale: 1.0, hpDrop: 0, stunnedTurns: 0, bleedingTurns: 0, armorTurns: 0, resistances: { phys: 0, bio: 50, energy: -5 } }

            { name: "Psycho", classType: "RAIDER", range: 'melee', maxHp: 45, speed: 14, armor: 0, dmgBase: 22, img: "enemy_psycho.png", scale: 1.0, hpDrop: 0, stunnedTurns: 0, bleedingTurns: 0, armorTurns: 0, resistances: { phys: 0, bio: 0, energy: 0 } },

        ],

            { name: "Drone", classType: "DRONE", range: 'ranged', isHovering: true, maxHp: 25, speed: 18, armor: 5, dmgBase: 10, img: "enemy_drone.png", scale: 0.7, hpDrop: 0, stunnedTurns: 0, bleedingTurns: 0, armorTurns: 0, resistances: { phys: 8, bio: 100, energy: -10 } },

            { name: "War Rig", classType: "MECH", range: 'ranged', maxHp: 150, speed: 5, armor: 10, dmgBase: 25, img: "enemy_warrig.png", scale: 1.8, hpDrop: -20, stunnedTurns: 0, bleedingTurns: 0, armorTurns: 0, resistances: { phys: 15, bio: 100, energy: -15 } }

function setCombatBackground(nodeType, tier) {
    let bgFile = 'bg_combat.png'; 
    if (tier === 1) { bgFile = 'bg_combat.png'; } 
    else {
        if (nodeType === 'BOSS') bgFile = 'bg_thunderdome.png';
        else if (nodeType === 'MECH') bgFile = 'bg_refinery.png';
        else if (nodeType === 'RAIDERS') bgFile = 'bg_highway.png';
        else if (nodeType === 'BEASTS') bgFile = 'bg_canyon.png';
    }
    document.getElementById('combat-sky-layer').style.backgroundImage = `linear-gradient(to bottom, rgba(43, 10, 10, 0.4) 0%, rgba(0, 0, 0, 0.5) 100%), url('${bgFile}')`;
}

function spawnFCT(entityId, msg, styleClass) {
    const el = document.getElementById(entityId); if (!el) return;
    const f = document.createElement('div'); f.className = `fct ${styleClass}`; f.innerText = msg; el.appendChild(f);
    setTimeout(() => { if (f.parentNode) f.parentNode.removeChild(f); }, 1000);
}

function initiateCombat(nodeType) {
    switchScreen('screen-combat'); combatActive = true; document.getElementById('log').innerHTML = '';
    setCombatBackground(nodeType, currentTier);

    let deployedRoster = playerRoster.filter(p => p.gridPos > 0);
    if (!deployedRoster.some(p => p.hp > 0)) { alert("All deployed units are dead. Adjust squad at Outpost."); renderOutpost(); return; }
    deployedRoster.sort((a, b) => a.gridPos - b.gridPos);

    playerRoster.forEach(ent => { ent.stunnedTurns = 0; ent.bleedingTurns = 0; ent.armorTurns = 0; ent.armor = 0; });
    const mult = 1 + ((currentTier - 1) * 0.4);
    activeEntities = [...deployedRoster, ...generateEnemies(nodeType, mult)];
    turnQueue = [...activeEntities].sort((a, b) => b.speed - a.speed);
    activeIndex = 0; log("> COMBAT INITIATED.", "log-turn"); processTurn();
}

const logEl = document.getElementById('log');
function log(msg, styleClass = "log-dmg") { const el = document.createElement('div'); el.className = styleClass; el.innerText = msg; logEl.appendChild(el); logEl.scrollTop = logEl.scrollHeight; }

function renderQueue() {
    const qStr = turnQueue.map(e => { if (e.hp <= 0) return ''; return (e.stunnedTurns > 0 ? '!' : '') + e.name.substring(0,3).toUpperCase(); }).filter(s => s !== '').join(' > ');
    document.getElementById('queue-display').innerText = `Q: ${qStr}`;
}

function renderField() {
    renderQueue(); const pTeam = document.getElementById('player-team'); const eTeam = document.getElementById('enemy-team'); pTeam.innerHTML = ''; eTeam.innerHTML = '';
    activeEntities.forEach(ent => {
        const isDead = ent.hp <= 0; const isAct = (!isDead && turnQueue.length > 0 && turnQueue[activeIndex]?.id === ent.id) ? 'active' : ''; const dCls = isDead ? 'dead' : '';
        let tCls = ''; let clk = '';
        if (pendingAction && !isDead) {
            if (pendingAction === 'CAUTERIZE' && ent.isPlayer) { tCls = 'targetable-ally'; clk = `onclick="resolveAction('${ent.id}')"`; } 
            else if (['ITEM_MED', 'ITEM_BOMB', 'ITEM_ADRENALINE', 'ITEM_EMP'].includes(pendingAction)) {
                if (pendingAction === 'ITEM_MED' && ent.isPlayer) { tCls = 'targetable-ally'; clk = `onclick="resolveConsumableItem('${ent.id}')"`; }
                else if (pendingAction === 'ITEM_ADRENALINE' && ent.isPlayer) { tCls = 'targetable-ally'; clk = `onclick="resolveConsumableItem('${ent.id}')"`; }
                else if (pendingAction === 'ITEM_BOMB' && !ent.isPlayer) { tCls = 'targetable-enemy'; clk = `onclick="resolveConsumableItem('${ent.id}')"`; }
                else if (pendingAction === 'ITEM_EMP' && !ent.isPlayer) { tCls = 'targetable-enemy'; clk = `onclick="resolveConsumableItem('${ent.id}')"`; }
            }
            else if (pendingAction !== 'CAUTERIZE' && !ent.isPlayer) { tCls = 'targetable-enemy'; clk = `onclick="resolveAction('${ent.id}')"`; }
        }
        let eff = ''; if (ent.bleedingTurns > 0 && !isDead) eff += `💧`; if (ent.stunnedTurns > 0 && !isDead) eff += `💫`; if (ent.armorTurns > 0 && !isDead) eff += `🛡️`;
        let hoverCls = ent.isHovering && !isDead ? 'hovering' : '';

        const html = `
            <div class="entity ${isAct} ${dCls} ${tCls}" id="${ent.id}" ${clk} style="--sprite-scale: ${ent.scale || 1};">
                <div style="width: 100%; position: relative; z-index: 10; transform: translateY(${ent.hpDrop || 0}px);">
                    <div class="hp-text"><span class="status-badge">${eff}</span> ${ent.hp}/${ent.maxHp}</div>
                    <div class="hp-container"><div class="hp-fill ${ent.isPlayer ? 'player-hp' : 'enemy-hp'}" style="width: ${(ent.hp / ent.maxHp) * 100}%"></div></div>
                </div><img class="portrait ${hoverCls}" src="${ent.img}">
            </div>`;
        if (ent.isPlayer) pTeam.innerHTML += html; else eTeam.innerHTML += html;
    });
    renderCommandDeck();
}

function renderCommandDeck() {
    const d = document.getElementById('command-deck'); d.innerHTML = ''; if (!combatActive) return;
    if (pendingAction) { d.innerHTML = `<button style="color:#8B0000; border-color:#8B0000" onclick="cancelAction()">CANCEL ORDERS</button>`; return; }
    let aE = turnQueue[activeIndex];
    if (!aE.isPlayer) { d.innerHTML = `<div class="dash-msg">ENEMY TURN...</div>`; return; }
    if (aE.stunnedTurns > 0) { d.innerHTML = `<div class="dash-msg">STUNNED</div><button onclick="skipStunnedTurn()">Skip Turn</button>`; return; }

    let cds = aE.cooldowns; let deckHtml = '';
    if (aE.classType === 'BRUISER') {
        deckHtml += `<button onclick="queueAction('SCRAP_BLADE')">Scrap Blade</button>`;
        deckHtml += `<button ${cds.heavy_wrench > 0 ? 'disabled' : ''} onclick="queueAction('HEAVY_WRENCH')">Heavy Wrench ${cds.heavy_wrench > 0 ? `[${cds.heavy_wrench}]` : ''}</button>`;
        deckHtml += `<button ${cds.iron_guard > 0 ? 'disabled' : ''} onclick="executeSelfAction('IRON_GUARD')">Iron Guard ${cds.iron_guard > 0 ? `[${cds.iron_guard}]` : ''}</button>`;
    } else if (aE.classType === 'MEDIC') {
        deckHtml += `<button onclick="queueAction('PISTOL')">Pistol</button>`;
        deckHtml += `<button onclick="queueAction('RAD_SHOT')">Rad Shot</button>`;
        deckHtml += `<button ${cds.cauterize > 0 ? 'disabled' : ''} onclick="queueAction('CAUTERIZE')">Cauterize ${cds.cauterize > 0 ? `[${cds.cauterize}]` : ''}</button>`;
    } else if (aE.classType === 'SCAVENGER') {
        deckHtml += `<button onclick="queueAction('PIPE_RIFLE')">Pipe Rifle</button>`;
        deckHtml += `<button ${cds.flashbang > 0 ? 'disabled' : ''} onclick="queueAction('FLASHBANG')">Flashbang ${cds.flashbang > 0 ? `[${cds.flashbang}]` : ''}</button>`;
    } else if (aE.classType === 'PYROMANIAC') {
        deckHtml += `<button onclick="queueAction('FLARE_GUN')">Flare Gun</button>`;
        deckHtml += `<button ${cds.molotov > 0 ? 'disabled' : ''} onclick="queueAction('MOLOTOV')">Molotov (AoE) ${cds.molotov > 0 ? `[${cds.molotov}]` : ''}</button>`;
    } else if (aE.classType === 'SHOTGUNNER') {
        deckHtml += `<button onclick="queueAction('SLUG_SHOT')">Slug Shot</button>`;
        deckHtml += `<button ${cds.buckshot > 0 ? 'disabled' : ''} onclick="queueAction('BUCKSHOT')">Buckshot (Front) ${cds.buckshot > 0 ? `[${cds.buckshot}]` : ''}</button>`;
    } else if (aE.classType === 'SNIPER') {
        deckHtml += `<button onclick="queueAction('QUICK_SHOT')">Quick Shot</button>`;
        deckHtml += `<button ${cds.deadeye > 0 ? 'disabled' : ''} onclick="queueAction('DEADEYE')">Deadeye (Back) ${cds.deadeye > 0 ? `[${cds.deadeye}]` : ''}</button>`;
    } else if (aE.classType === 'HOUND') {
        deckHtml += `<button onclick="queueAction('SNAP')">Snap</button>`;
        deckHtml += `<button ${cds.feral_bite > 0 ? 'disabled' : ''} onclick="queueAction('FERAL_BITE')">Feral Bite (Bleed) ${cds.feral_bite > 0 ? `[${cds.feral_bite}]` : ''}</button>`;
    }

    if (inventory.length > 0) { deckHtml += `<button style="border-color:#B8860B; color:#B8860B;" onclick="openInventoryMenu()">BAG (${inventory.length})</button>`; }
    d.innerHTML = deckHtml;
}

function openInventoryMenu() {
    const d = document.getElementById('command-deck');
    let h = `<div class="dash-msg" style="color:#B8860B; font-weight:bold;">SELECT ITEM:</div>`;
    inventory.forEach((item, idx) => {
        let name = item === 'MED_STIM' ? 'Med-Stim' : item === 'SCRAP_BOMB' ? 'Scrap Bomb' : item === 'ADRENALINE' ? 'Adrenaline' : 'EMP Charge';
        h += `<button onclick="triggerItem(${idx})">${name}</button>`;
    });
    h += `<button onclick="renderCommandDeck()">BACK</button>`; d.innerHTML = h;
}

function triggerItem(invIndex) {
    let item = inventory[invIndex];
    if (item === 'MED_STIM') { pendingAction = 'ITEM_MED'; inventoryToConsume = invIndex; log("> Select ally for Med-Stim.", "log-status"); renderField(); }
    else if (item === 'ADRENALINE') { pendingAction = 'ITEM_ADRENALINE'; inventoryToConsume = invIndex; log("> Select ally for Adrenaline.", "log-status"); renderField(); }
    else if (item === 'SCRAP_BOMB') { pendingAction = 'ITEM_BOMB'; inventoryToConsume = invIndex; log("> Select enemy target for Scrap Bomb.", "log-status"); renderField(); }
    else if (item === 'EMP_CHARGE') { pendingAction = 'ITEM_EMP'; inventoryToConsume = invIndex; log("> Select enemy for EMP Charge.", "log-status"); renderField(); }
}

let inventoryToConsume = -1;
function resolveConsumableItem(targetId) {
    let target = activeEntities.find(e => e.id === targetId); let item = inventory[inventoryToConsume];
    if (item === 'MED_STIM') { let heal = 30; target.hp = Math.min(target.maxHp, target.hp + heal); log(`> Used Med-Stim on ${target.name} for ${heal} HP.`, "log-heal"); spawnFCT(target.id, `+${heal}`, "fct-heal");
    } else if (item === 'ADRENALINE') { target.stunnedTurns = 0; target.bleedingTurns = 0; log(`> Used Adrenaline on ${target.name}. Cleared effects!`, "log-heal"); spawnFCT(target.id, "CLEANSE", "fct-heal");
    } else if (item === 'SCRAP_BOMB') {
        inventory.splice(inventoryToConsume, 1);
        activeEntities.forEach(e => { if (!e.isPlayer && e.hp > 0) { let dmg = 25; e.hp = Math.max(0, e.hp - dmg); spawnFCT(e.id, `-${dmg}`, "fct-dmg"); } });
        log(`> Threw Scrap Bomb for 25 AoE DMG!`, "log-dmg"); pendingAction = null; checkWinState(); return;
    } else if (item === 'EMP_CHARGE') {
        target.armor = 0; target.armorTurns = 0; target.hp = Math.max(0, target.hp - 10); target.stunnedTurns = 1;
        log(`> EMP Charge strips ${target.name}'s armor and stuns!`, "log-dmg"); spawnFCT(target.id, "EMP SHOCK", "fct-status");
    }
    inventory.splice(inventoryToConsume, 1); inventoryToConsume = -1; pendingAction = null; checkWinState();
}

function processTurn() {
    if (!combatActive) return; pendingAction = null; let aE = turnQueue[activeIndex]; if (aE.hp <= 0) { nextTurn(); return; }
    renderField(); applyTurnStartEffects(aE); if (!combatActive) return; if (!aE.hp > 0) return checkWinState(); 
    if (aE.stunnedTurns > 0) { if (!aE.isPlayer) { log(`> ${aE.name} stunned.`, "log-status"); spawnFCT(aE.id, "STUNNED", "fct-status"); aE.stunnedTurns--; setTimeout(nextTurn, 1000); return; } else return; }
    if (!aE.isPlayer) setTimeout(() => executeEnemyAi(aE), 1000);
}

function applyTurnStartEffects(ent) {
    let chg = false; if (ent.isPlayer && ent.cooldowns) { for (let s in ent.cooldowns) { if (ent.cooldowns[s] > 0) { ent.cooldowns[s]--; chg = true; } } }
    if (ent.bleedingTurns > 0) { let b = Math.max(1, Math.floor(ent.maxHp * 0.08)); ent.hp = Math.max(0, ent.hp - b); log(`> ${ent.name} bleeds for ${b}.`, "log-dmg"); spawnFCT(ent.id, `-${b}`, "fct-dmg"); ent.bleedingTurns--; chg = true; }
    if (ent.armorTurns > 0) { ent.armorTurns--; if (ent.armorTurns === 0) { ent.armor = 0; } chg = true; }
    if (chg) renderField();
}

function skipStunnedTurn() { turnQueue[activeIndex].stunnedTurns--; renderField(); setTimeout(nextTurn, 500); }
function queueAction(a) { pendingAction = a; renderField(); }
function cancelAction() { pendingAction = null; renderField(); }

function resolveAction(targetId) {
    let actEnt = turnQueue[activeIndex]; let target = activeEntities.find(e => e.id === targetId);
    let livingEnemies = activeEntities.filter(e => !e.isPlayer && e.hp > 0);
    let dist = livingEnemies.findIndex(e => e.id === targetId);

    if (pendingAction === 'CAUTERIZE') {
        let heal = 20 + Math.floor(Math.random() * 10); target.hp = Math.min(target.maxHp, target.hp + heal); actEnt.cooldowns.cauterize = 3; 
        log(`> ${actEnt.name} heals ${target.name} for ${heal}.`, "log-heal"); spawnFCT(target.id, `+${heal}`, "fct-heal");
    } else {
        let atkType = 'phys'; if(['RAD_SHOT', 'FERAL_BITE'].includes(pendingAction)) atkType = 'bio'; if(['FLASHBANG', 'MOLOTOV', 'FLARE_GUN'].includes(pendingAction)) atkType = 'energy';
        let baseDmg = actEnt.dmgBase + Math.floor(Math.random() * 6); let dmgMult = 1.0;

        if (pendingAction === 'FLASHBANG') { dmgMult = 0.4; actEnt.cooldowns.flashbang = 4; }
        if (pendingAction === 'HEAVY_WRENCH') { dmgMult = 1.5; actEnt.cooldowns.heavy_wrench = 3; }
        if (pendingAction === 'FERAL_BITE') { dmgMult = 1.2; actEnt.cooldowns.feral_bite = 3; }
        
        if (pendingAction === 'BUCKSHOT') { if (dist === 0) dmgMult = 1.5; else dmgMult = 0.8; actEnt.cooldowns.buckshot = 2; }
        if (pendingAction === 'DEADEYE') { if (dist === livingEnemies.length - 1 && dist !== 0) dmgMult = 1.8; else dmgMult = 0.8; actEnt.cooldowns.deadeye = 2; }

        applyDamageHit(actEnt, target, Math.floor(baseDmg * dmgMult), atkType, pendingAction);

        if (pendingAction === 'MOLOTOV') {
            actEnt.cooldowns.molotov = 3; let secondaries = livingEnemies.filter(e => e.id !== targetId);
            if (secondaries.length > 0) { let sTarg = secondaries[Math.floor(Math.random() * secondaries.length)]; applyDamageHit(actEnt, sTarg, Math.floor(baseDmg * 0.7), atkType, null); }
        }
    }
    pendingAction = null; checkWinState();
}

function applyDamageHit(attacker, target, calcDmg, atkType, abilityStr) {
    if (target.hp <= 0) return; let resistValue = target.resistances[atkType] || 0; let armorCalc = abilityStr === 'FERAL_BITE' ? 0 : target.armor;
    let netDmg = Math.max(1, calcDmg - resistValue - armorCalc); if (resistValue >= 100) netDmg = 0; target.hp = Math.max(0, target.hp - netDmg);
    let logStyle = "log-dmg"; let logMsg = `> ${attacker.name} hits ${target.name} for ${netDmg}`;

    if (netDmg === 0 && resistValue >= 100) { logMsg += " (Immune)."; spawnFCT(target.id, "IMMUNE", "fct-status");
    } else if (resistValue > 5) { logMsg += " (Resisted)."; spawnFCT(target.id, `-${netDmg}`, "fct-dmg");
    } else if (resistValue < 0) { logMsg += " (Weakness!)."; logStyle = "log-dmg"; spawnFCT(target.id, `-${netDmg}!`, "fct-weak"); 
    } else { spawnFCT(target.id, `-${netDmg}`, "fct-dmg"); }
    
    log(logMsg, logStyle);

    if (abilityStr === 'RAD_SHOT' || abilityStr === 'FERAL_BITE') {
        if (Math.random() < (abilityStr === 'FERAL_BITE' ? 0.9 : 0.6)) { target.bleedingTurns = 3; log(`> ${target.name} bleeding!`, "log-dmg"); setTimeout(() => spawnFCT(target.id, "BLEED", "fct-status"), 300); }
    } else if (abilityStr === 'HEAVY_WRENCH' || abilityStr === 'FLASHBANG') {
        let sc = (abilityStr === 'FLASHBANG') ? 0.35 : 0.2; if (abilityStr === 'FLASHBANG' && target.resistances.energy < 0) sc *= 2;
        if (Math.random() < sc) { target.stunnedTurns = 1; log(`> ${target.name} stunned!`, "log-status"); setTimeout(() => spawnFCT(target.id, "STUNNED", "fct-status"), 300); }
    }
}

function executeSelfAction(actionType) {
    let actEnt = turnQueue[activeIndex];
    if (actionType === 'IRON_GUARD') { actEnt.armor += 20; actEnt.armorTurns = 2; actEnt.cooldowns.iron_guard = 4; spawnFCT(actEnt.id, "+ARMOR", "fct-heal"); }
    checkWinState();
}

function executeEnemyAi(enemy) {
    if (!combatActive) return;
    if (enemy.classType === 'BOSS' && enemy.phase === 1 && enemy.hp <= (enemy.maxHp / 2)) {
        enemy.phase = 2; log(`> WARLORD ENRAGED!`, "log-dmg"); spawnFCT(enemy.id, "ENRAGED!", "fct-status"); enemy.dmgBase = Math.floor(enemy.dmgBase * 1.5);
        const m = 1 + ((currentTier - 1) * 0.4); const d = { name: "War Hound", classType: "BEAST", range: 'melee', maxHp: Math.floor(30*m), hp: Math.floor(30*m), speed: 18, armor: 0, isPlayer: false, dmgBase: Math.floor(12*m), img: "enemy_dog.png", scale: 0.8, hpDrop: 0, stunnedTurns: 0, bleedingTurns: 0, armorTurns: 0, resistances: { phys: -2, bio: 0, energy: 0 } };
        for(let i = 0; i < 2; i++) { let n = JSON.parse(JSON.stringify(d)); n.id = `summon_${Date.now()}_${i}`; activeEntities.push(n); turnQueue.push(n); }
        renderField(); setTimeout(nextTurn, 1000); return;
    }

    let validTargets = activeEntities.filter(e => e.isPlayer && e.hp > 0); 
    if (validTargets.length === 0) return;
    
    let target;
    if (enemy.range === 'melee') {
        validTargets.sort((a, b) => a.gridPos - b.gridPos);
        target = validTargets[0]; 
    } else {
        target = validTargets.sort(() => 0.5 - Math.random())[0];
    }

    if (target) {
        let t = enemy.dmgType || 'phys'; let d = enemy.dmgBase + Math.floor(Math.random() * 5);
        let res = target.resistances[t] || 0; let net = Math.max(1, d - res - target.armor); target.hp = Math.max(0, target.hp - net);
        
        let posStr = target.gridPos === 1 ? 'Front' : target.gridPos === 2 ? 'Mid' : 'Back';
        log(`> ${enemy.name} hits ${target.name} [${posStr}] for ${net}`, "log-dmg"); spawnFCT(target.id, `-${net}`, "fct-dmg");

        if (["Mutant", "Attack Dog", "War Hound", "Chem Fiend"].includes(enemy.name) && Math.random() < 0.4) {
            target.bleedingTurns = 2; setTimeout(() => spawnFCT(target.id, "BLEED", "fct-status"), 300);
        } else if ((enemy.name === "Sniper" || enemy.classType === "BOSS") && Math.random() < 0.25) {
            target.stunnedTurns = 1; setTimeout(() => spawnFCT(target.id, "STUNNED", "fct-status"), 300);
        }
    }
    checkWinState();
}

function handleSquadWipe() {
    currentTier = 1;
    playerRoster.forEach(char => { char.hp = char.maxHp; char.stunnedTurns = 0; char.bleedingTurns = 0; char.armor = 0; char.armorTurns = 0; if(char.cooldowns) { for (let s in char.cooldowns) char.cooldowns[s] = 0; } });
    saveGameState(); renderMap();
}

function checkWinState() {
    renderField();
    const pA = activeEntities.some(e => e.isPlayer && e.hp > 0); const eA = activeEntities.some(e => !e.isPlayer && e.hp > 0);
    if (!pA) { document.getElementById('command-deck').innerHTML = `<button onclick="handleSquadWipe()">EXPEDITION FAILED - RESTART</button>`; combatActive = false; } 
    else if (!eA) { 
        let s = Math.floor(Math.random() * 30) + (currentTier * 20); 
        playerRoster.forEach(char => {
            if (char.gridPos > 0 && char.hp > 0) {
                char.xp += 35;
                if (char.xp >= char.xpToNext) { char.level++; char.xp -= char.xpToNext; char.xpToNext = Math.floor(char.xpToNext * 1.5); char.perkPoints++; log(`> ${char.name} reached Level ${char.level}! Perk point available.`, "log-heal"); }
            }
        });

        // V32 Loot Drops (Replaced fixed consumables with raw materials)
        let matDrops = 1 + Math.floor(Math.random() * 2);
        for(let i=0; i<matDrops; i++) {
            let m = ['parts', 'chems', 'tech'][Math.floor(Math.random() * 3)];
            materials[m]++;
            log(`> Salvaged: 1 ${m.toUpperCase()}`, "log-heal");
        }

        document.getElementById('command-deck').innerHTML = `<button onclick="collectLoot(${s})">LOOT ${s}</button>`; combatActive = false; 
    } 
    else { if (pendingAction === null) setTimeout(nextTurn, 800); }
}

function collectLoot(a) { scrap += a; currentTier++; playerRoster.forEach(p => p.armor = 0); saveGameState(); renderMap(); }
function nextTurn() { activeIndex++; if (activeIndex >= turnQueue.length) activeIndex = 0; processTurn(); }
renderTitleScreen();
</script>
